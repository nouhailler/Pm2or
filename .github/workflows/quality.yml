name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install uv
        run: python -m pip install uv==0.11.26
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest --cov=pm2 --cov-report=term-missing --cov-report=xml
      - name: Lint
        run: uv run ruff check src tests scripts migrations
      - name: Type check
        run: uv run mypy src/pm2
      - name: Build wheel
        run: uv build --wheel

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.26
          uv sync --frozen --extra dev
      - name: Audit runtime dependencies
        run: |
          mkdir -p build
          uv export --frozen --no-dev --no-emit-project --format requirements-txt \
            --output-file build/runtime-requirements.txt >/dev/null
          uv run pip-audit --requirement build/runtime-requirements.txt --no-deps --disable-pip
      - name: Generate CycloneDX SBOM
        run: >-
          uv run cyclonedx-py environment --pyproject pyproject.toml
          --output-reproducible --of JSON -o build/sbom.cdx.json .venv
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom
          path: build/sbom.cdx.json

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install uv==0.11.26
          uv sync --frozen --extra dev
      - name: Build and test PyInstaller bundle
        run: |
          uv run pyinstaller --noconfirm pm2-desktop.spec
          PM2_DATA_DIR="$RUNNER_TEMP/bundle-data" dist/pm2-desktop/pm2-desktop --headless-check
      - name: Build, install and test Debian package
        run: |
          PYTHONPATH=src uv run python scripts/package_deb.py
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            debian:13-slim \
            sh -euxc '
              apt-get update
              apt-get install -y ./dist/pm2-desktop_*_amd64.deb
              PM2_DATA_DIR=/tmp/package-data pm2-desktop --headless-check
            '
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: debian-package
          path: dist/pm2-desktop_*_amd64.deb
