name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest
      - name: Lint
        run: uv run ruff check src tests scripts migrations
      - name: Type check
        run: uv run mypy src/pm2/domain src/pm2/application src/pm2/infrastructure src/pm2/methodology
      - name: Build wheel
        run: uv build --wheel
