activities:
  - code: LA-001
    phase: LAUNCH
    name: Demande d'Initiation de Projet
    objective: "Formaliser le contexte, le besoin/problème/opportunité et les résultats souhaités."
    inputs: []
    outputs: [PROJECT_INITIATION_REQUEST]
    related_artifacts: [PROJECT_INITIATION_REQUEST]
    source_section: "5.2"
  - code: LA-002
    phase: LAUNCH
    name: Étude d'Opportunité
    objective: "Documenter la justification du projet, les besoins budgétaires, le contexte, les alternatives et une feuille de route de haut niveau."
    inputs: [PROJECT_INITIATION_REQUEST]
    outputs: [BUSINESS_CASE]
    related_artifacts: [BUSINESS_CASE]
    source_section: "5.3"
  - code: LA-003
    phase: LAUNCH
    name: Charte du Projet
    objective: "Définir le projet en termes de périmètre, coût, temps, qualité, besoins de haut niveau, risques, contraintes, jalons et livrables."
    inputs: [PROJECT_INITIATION_REQUEST, BUSINESS_CASE]
    outputs: [PROJECT_CHARTER]
    related_artifacts: [PROJECT_CHARTER]
    source_section: "5.4"
  - code: PL-001
    phase: PLANNING
    name: Réunion de lancement
    objective: "Commencer officiellement la Phase de Planification."
    inputs: [PROJECT_CHARTER]
    outputs: [MEETING_MINUTES]
    related_artifacts: [MEETING_MINUTES]
    source_section: "6.1"
  - code: PL-002
    phase: PLANNING
    name: Manuel du projet
    objective: "Définir l'approche de gestion du projet, les rôles et responsabilités et les dispositions de gestion."
    inputs: [PROJECT_CHARTER]
    outputs: [PROJECT_HANDBOOK]
    related_artifacts: [PROJECT_HANDBOOK]
    source_section: "6.2"
  - code: PL-003
    phase: PLANNING
    name: Matrice des Parties Prenantes
    objective: "Identifier les intervenants clés, leurs coordonnées, leurs rôles et éventuellement leur catégorisation."
    inputs: [BUSINESS_CASE, PROJECT_CHARTER, MEETING_MINUTES]
    outputs: [STAKEHOLDER_MATRIX]
    related_artifacts: [STAKEHOLDER_MATRIX]
    source_section: "6.3"
  - code: PL-004
    phase: PLANNING
    name: Plan de travail du projet
    objective: "Décomposer, organiser et planifier les activités et livrables, avec efforts, coûts et échéancier."
    inputs: [BUSINESS_CASE, PROJECT_CHARTER]
    outputs: [WORK_PLAN]
    related_artifacts: [WORK_PLAN]
    source_section: "6.4"
  - code: PL-005
    phase: PLANNING
    name: Plan d'Externalisation
    objective: "Planifier et contrôler les activités confiées à des sous-traitants lorsque l'externalisation est applicable."
    inputs: [PROJECT_CHARTER, PROJECT_HANDBOOK]
    outputs: [OUTSOURCING_PLAN]
    related_artifacts: [OUTSOURCING_PLAN]
    source_section: "6.5"
    optional: true
  - code: PL-006
    phase: PLANNING
    name: Plan d'Acceptation des Livrables
    objective: "Définir les critères, responsabilités, activités, échéancier et ressources nécessaires à l'acceptation officielle des livrables."
    inputs: [PROJECT_CHARTER, PROJECT_HANDBOOK, WORK_PLAN, REQUIREMENTS_MANAGEMENT_PLAN, QUALITY_MANAGEMENT_PLAN]
    outputs: [DELIVERABLE_ACCEPTANCE_PLAN]
    related_artifacts: [DELIVERABLE_ACCEPTANCE_PLAN]
    source_section: "6.6"
  - code: PL-007
    phase: PLANNING
    name: Plan de Transition
    objective: "Définir les objectifs, prérequis, activités et responsabilités de transition vers l'état post-projet."
    inputs: [BUSINESS_CASE, PROJECT_CHARTER, WORK_PLAN, CHANGE_MANAGEMENT_PLAN, ORGANISATIONAL_IMPLEMENTATION_PLAN]
    outputs: [TRANSITION_PLAN]
    related_artifacts: [TRANSITION_PLAN]
    source_section: "6.7"
    optional: true
  - code: PL-008
    phase: PLANNING
    name: Plan de Mise en Œuvre Organisationnelle
    objective: "Analyser l'impact sur les processus, la culture et les personnes et planifier les activités de mise en œuvre et de changement."
    inputs: [BUSINESS_CASE, PROJECT_CHARTER, PROJECT_HANDBOOK, WORK_PLAN, TRANSITION_PLAN, QUALITY_MANAGEMENT_PLAN]
    outputs: [ORGANISATIONAL_IMPLEMENTATION_PLAN]
    related_artifacts: [ORGANISATIONAL_IMPLEMENTATION_PLAN]
    source_section: "6.8"
    optional: true
  - code: PL-009
    phase: PLANNING
    name: Plan de gestion des besoins
    objective: "Définir comment les besoins sont documentés, suivis, contrôlés et vérifiés."
    inputs: [PROJECT_CHARTER, STAKEHOLDER_MATRIX]
    outputs: [REQUIREMENTS_MANAGEMENT_PLAN]
    related_artifacts: [REQUIREMENTS_MANAGEMENT_PLAN]
    source_section: "6.2.2 / 9.5"
  - code: PL-010
    phase: PLANNING
    name: Plan de gestion des modifications
    objective: "Définir le processus de demande, analyse, approbation, planification, contrôle et communication des changements."
    inputs: [PROJECT_CHARTER, PROJECT_HANDBOOK]
    outputs: [CHANGE_MANAGEMENT_PLAN]
    related_artifacts: [CHANGE_MANAGEMENT_PLAN]
    source_section: "6.2.2 / 9.6"
  - code: PL-011
    phase: PLANNING
    name: Plan de gestion des risques
    objective: "Définir l'approche de gestion, d'évaluation, de réponse, de tolérance et d'escalade des risques."
    inputs: [PROJECT_CHARTER, PROJECT_HANDBOOK]
    outputs: [RISK_MANAGEMENT_PLAN]
    related_artifacts: [RISK_MANAGEMENT_PLAN]
    source_section: "6.2.2 / 9.7"
  - code: PL-012
    phase: PLANNING
    name: Plan de gestion des problèmes
    objective: "Définir le processus d'identification, évaluation, attribution, résolution, contrôle et escalade des problèmes."
    inputs: [PROJECT_CHARTER, PROJECT_HANDBOOK]
    outputs: [ISSUE_MANAGEMENT_PLAN]
    related_artifacts: [ISSUE_MANAGEMENT_PLAN]
    source_section: "6.2.2 / 9.8"
  - code: PL-013
    phase: PLANNING
    name: Plan de gestion de la qualité
    objective: "Définir les activités de planification, assurance, contrôle et amélioration de la qualité ainsi que la configuration."
    inputs: [PROJECT_CHARTER, PROJECT_HANDBOOK]
    outputs: [QUALITY_MANAGEMENT_PLAN]
    related_artifacts: [QUALITY_MANAGEMENT_PLAN]
    source_section: "6.2.2 / 9.9"
  - code: PL-014
    phase: PLANNING
    name: Plan de communication
    objective: "Définir les besoins, méthodes et fréquences de communication avec les parties prenantes."
    inputs: [PROJECT_CHARTER, STAKEHOLDER_MATRIX]
    outputs: [COMMUNICATIONS_MANAGEMENT_PLAN]
    related_artifacts: [COMMUNICATIONS_MANAGEMENT_PLAN]
    source_section: "6.2.2 / 9.4"
  - code: EX-001
    phase: EXECUTION
    name: Réunion de lancement de la Phase d'Exécution
    objective: "Commencer officiellement la Phase d'Exécution."
    inputs: [PROJECT_HANDBOOK, WORK_PLAN]
    outputs: [MEETING_MINUTES]
    related_artifacts: [MEETING_MINUTES]
    source_section: "7.1"
  - code: EX-002
    phase: EXECUTION
    name: Coordination du projet
    objective: "Diriger et coordonner les activités, affecter les tâches, fournir les informations, vérifier les tâches et les livrables intermédiaires."
    inputs: [PROJECT_HANDBOOK, WORK_PLAN]
    outputs: [WORK_PLAN]
    related_artifacts: [WORK_PLAN]
    source_section: "7.2"
  - code: EX-003
    phase: EXECUTION
    name: Assurance qualité
    objective: "Fournir des preuves que les activités et livrables respectent les normes, méthodes et critères de qualité."
    inputs: [QUALITY_MANAGEMENT_PLAN, WORK_PLAN]
    outputs: [QUALITY_REPORT]
    related_artifacts: [QUALITY_MANAGEMENT_PLAN, QUALITY_REPORT]
    source_section: "7.3"
  - code: EX-004
    phase: EXECUTION
    name: Rapports sur le projet
    objective: "Communiquer des informations consolidées sur la performance du projet."
    inputs: [PROJECT_HANDBOOK, WORK_PLAN, COMMUNICATIONS_MANAGEMENT_PLAN, RISK_REGISTER, ISSUE_REGISTER, CHANGE_REGISTER]
    outputs: [PROJECT_REPORT]
    related_artifacts: [PROJECT_REPORT]
    source_section: "7.4"
  - code: EX-005
    phase: EXECUTION
    name: Distribution de l'information
    objective: "Tenir les intervenants informés conformément au plan de communication et à leurs besoins."
    inputs: [COMMUNICATIONS_MANAGEMENT_PLAN, WORK_PLAN, PROJECT_REPORT, MEETING_MINUTES]
    outputs: [COMMUNICATION_LOG]
    related_artifacts: [COMMUNICATIONS_MANAGEMENT_PLAN, PROJECT_REPORT]
    source_section: "7.5"
  - code: MC-001
    phase: MONITORING_CONTROL
    name: Surveiller la performance
    objective: "Mesurer les activités et évaluer la performance par rapport aux plans."
    inputs: [WORK_PLAN, PROJECT_REPORT]
    outputs: [PERFORMANCE_STATUS]
    source_section: "9.3"
  - code: MC-002
    phase: MONITORING_CONTROL
    name: Contrôle de l'échéancier
    objective: "Surveiller l'avancement temporel et prendre les mesures correctives nécessaires."
    inputs: [WORK_PLAN, PERFORMANCE_STATUS]
    outputs: [WORK_PLAN]
    source_section: "9.3"
  - code: MC-003
    phase: MONITORING_CONTROL
    name: Contrôle des coûts
    objective: "Surveiller les coûts et contrôler les écarts par rapport à la référence."
    inputs: [WORK_PLAN, PERFORMANCE_STATUS]
    outputs: [COST_STATUS]
    source_section: "9.3"
  - code: MC-004
    phase: MONITORING_CONTROL
    name: Gérer les parties prenantes
    objective: "Analyser et gérer continuellement les attentes, attitudes, intérêts et influence des parties prenantes."
    inputs: [PROJECT_HANDBOOK, STAKEHOLDER_MATRIX, COMMUNICATIONS_MANAGEMENT_PLAN, TRANSITION_PLAN, DELIVERABLE_ACCEPTANCE_PLAN, ORGANISATIONAL_IMPLEMENTATION_PLAN]
    outputs: [STAKEHOLDER_STATUS]
    source_section: "9.4"
  - code: MC-005
    phase: MONITORING_CONTROL
    name: Gérer les besoins
    objective: "Gérer les besoins, leur vérification et leurs changements pendant le cycle de vie."
    inputs: [PROJECT_INITIATION_REQUEST, PROJECT_CHARTER, REQUIREMENTS_MANAGEMENT_PLAN, DELIVERABLE_ACCEPTANCE_PLAN, STAKEHOLDER_MATRIX, WORK_PLAN, CHANGE_REGISTER]
    outputs: [REQUIREMENT_STATUS, WORK_PLAN]
    source_section: "9.5"
  - code: MC-006
    phase: MONITORING_CONTROL
    name: Gérer les modifications
    objective: "Identifier, documenter, évaluer, prioriser, approuver, planifier, contrôler et communiquer les changements."
    inputs: [BUSINESS_CASE, PROJECT_CHARTER, CHANGE_MANAGEMENT_PLAN, WORK_PLAN, COMMUNICATIONS_MANAGEMENT_PLAN]
    outputs: [CHANGE_REGISTER, WORK_PLAN]
    source_section: "9.6"
  - code: MC-007
    phase: MONITORING_CONTROL
    name: Gérer les risques
    objective: "Identifier, évaluer, traiter, surveiller et escalader les risques conformément au processus défini."
    inputs: [RISK_MANAGEMENT_PLAN, WORK_PLAN]
    outputs: [RISK_REGISTER, WORK_PLAN]
    source_section: "9.7"
  - code: MC-008
    phase: MONITORING_CONTROL
    name: Gérer les problèmes et les décisions
    objective: "Identifier, évaluer, attribuer et résoudre les problèmes et documenter les décisions associées."
    inputs: [ISSUE_MANAGEMENT_PLAN, WORK_PLAN, ISSUE_REGISTER, DECISION_REGISTER, MEETING_MINUTES]
    outputs: [ISSUE_REGISTER, DECISION_REGISTER, WORK_PLAN]
    source_section: "9.8"
  - code: MC-009
    phase: MONITORING_CONTROL
    name: Gérer la qualité
    objective: "Planifier, assurer, contrôler et améliorer la qualité et gérer la configuration des artefacts."
    inputs: [QUALITY_MANAGEMENT_PLAN, WORK_PLAN]
    outputs: [QUALITY_REPORT]
    source_section: "9.9"
  - code: MC-010
    phase: MONITORING_CONTROL
    name: Gérer l'acceptation des livrables
    objective: "Vérifier que chaque livrable répond aux objectifs et critères prédéfinis et documenter son acceptation."
    inputs: [DELIVERABLE_ACCEPTANCE_PLAN, WORK_PLAN, QUALITY_MANAGEMENT_PLAN, OUTSOURCING_PLAN]
    outputs: [ACCEPTANCE_RECORD, DECISION_REGISTER]
    source_section: "9.10"
  - code: MC-011
    phase: MONITORING_CONTROL
    name: Gérer la mise en œuvre
    objective: "Suivre et contrôler les activités de mise en œuvre organisationnelle."
    inputs: [ORGANISATIONAL_IMPLEMENTATION_PLAN, WORK_PLAN, TRANSITION_PLAN]
    outputs: [IMPLEMENTATION_STATUS, WORK_PLAN]
    source_section: "9.12"
    optional: true
  - code: MC-012
    phase: MONITORING_CONTROL
    name: Gérer la transition
    objective: "Assurer une transition contrôlée vers le nouvel état et le transfert correct des livrables."
    inputs: [TRANSITION_PLAN, WORK_PLAN, COMMUNICATIONS_MANAGEMENT_PLAN, DELIVERABLE_ACCEPTANCE_PLAN, ORGANISATIONAL_IMPLEMENTATION_PLAN]
    outputs: [TRANSITION_STATUS]
    source_section: "9.11"
    optional: true
  - code: MC-013
    phase: MONITORING_CONTROL
    name: Gérer l'externalisation
    objective: "Surveiller et contrôler les activités, livrables et obligations liés aux sous-traitants."
    inputs: [OUTSOURCING_PLAN, WORK_PLAN, PROJECT_REPORT]
    outputs: [OUTSOURCING_STATUS]
    source_section: "9.13"
    optional: true
  - code: CL-001
    phase: CLOSING
    name: Réunion de fin de projet
    objective: "Examiner la performance globale, celle de l'équipe et des sous-traitants et documenter les leçons apprises."
    inputs: [PROJECT_REPORT, QUALITY_REPORT, WORK_PLAN, LESSONS_LEARNED]
    outputs: [MEETING_MINUTES, LESSONS_LEARNED]
    source_section: "8.1"
  - code: CL-002
    phase: CLOSING
    name: Rapport de fin de projet
    objective: "Documenter l'expérience, la performance, les bonnes pratiques, les écueils et les leçons apprises."
    inputs: [PROJECT_REPORT, QUALITY_REPORT, LESSONS_LEARNED]
    outputs: [PROJECT_END_REPORT]
    related_artifacts: [PROJECT_END_REPORT, LESSONS_LEARNED]
    source_section: "8.2"
  - code: CL-003
    phase: CLOSING
    name: Fermeture administrative
    objective: "Vérifier l'acceptation, transférer les livrables, organiser et archiver les documents, libérer les ressources et obtenir l'approbation finale du PO."
    inputs: [PROJECT_END_REPORT, PROJECT_HANDBOOK, WORK_PLAN]
    outputs: [PROJECT_ARCHIVE, PROJECT_ACCEPTANCE_NOTE]
    source_section: "8.4"

artifacts:
  PROJECT_INITIATION_REQUEST:
    name: Demande d'Initiation de Projet
    phase: LAUNCH
    required: true
  BUSINESS_CASE:
    name: Étude d'Opportunité
    phase: LAUNCH
    required: true
  PROJECT_CHARTER:
    name: Charte du Projet
    phase: LAUNCH
    required: true
  PROJECT_HANDBOOK:
    name: Manuel du Projet
    phase: PLANNING
    required: true
  STAKEHOLDER_MATRIX:
    name: Matrice des Parties Prenantes
    phase: PLANNING
    required: true
  WORK_PLAN:
    name: Plan de Travail du Projet
    phase: PLANNING
    required: true
    baseline: true
  OUTSOURCING_PLAN:
    name: Plan d'Externalisation
    phase: PLANNING
    required: false
  DELIVERABLE_ACCEPTANCE_PLAN:
    name: Plan d'Acceptation des Livrables
    phase: PLANNING
    required: true
  TRANSITION_PLAN:
    name: Plan de Transition
    phase: PLANNING
    required: false
  ORGANISATIONAL_IMPLEMENTATION_PLAN:
    name: Plan de Mise en Œuvre Organisationnelle
    phase: PLANNING
    required: false
  REQUIREMENTS_MANAGEMENT_PLAN:
    name: Plan de Gestion des Besoins
    phase: PLANNING
    required: true
  CHANGE_MANAGEMENT_PLAN:
    name: Plan de Gestion des Modifications
    phase: PLANNING
    required: true
  RISK_MANAGEMENT_PLAN:
    name: Plan de Gestion des Risques
    phase: PLANNING
    required: true
  ISSUE_MANAGEMENT_PLAN:
    name: Plan de Gestion des Problèmes
    phase: PLANNING
    required: true
  QUALITY_MANAGEMENT_PLAN:
    name: Plan de Gestion de la Qualité
    phase: PLANNING
    required: true
  COMMUNICATIONS_MANAGEMENT_PLAN:
    name: Plan de Communication
    phase: PLANNING
    required: true
  PROJECT_REPORT:
    name: Rapport sur le Projet
    phase: EXECUTION
    required: true
  QUALITY_REPORT:
    name: Rapport Qualité
    phase: EXECUTION
    required: true
  MEETING_MINUTES:
    name: Procès-Verbal / Minutes de réunion
    phase: EXECUTION
    required: true
  PROJECT_END_REPORT:
    name: Rapport de Fin de Projet
    phase: CLOSING
    required: true
  LESSONS_LEARNED:
