methodology:
  id: pm2
  name: PM²
  version: "3.1"
  language: fr
  source: "Le Guide Méthodologie PM² v3.1 — version française fournie"
  machine_readable_contract: true
  implementation_policy:
    - "Les codes, phases, gates, rôles, responsabilités, activités et artefacts définis ici sont la source de vérité applicative V0.1."
    - "Les champs non explicitement définis par le guide mais nécessaires au fonctionnement logiciel sont des conventions d'implémentation et ne doivent pas être présentés comme des exigences PM² officielles."
    - "La méthodologie doit être chargée depuis ce fichier et non codée en dur dans l'interface."

lifecycle:
  phases:
    - code: LAUNCH
      name: Lancement
      order: 1
      purpose: "Définir les résultats souhaités, établir la justification et définir le périmètre initial."
      source_section: "3.2.1 / 5"
    - code: PLANNING
      name: Planification
      order: 2
      purpose: "Transformer l'objectif du projet en un plan précis et réalisable prêt à être exécuté."
      source_section: "3.2.2 / 6"
    - code: EXECUTION
      name: Exécution
      order: 3
      purpose: "Produire les livrables du projet et préparer leur introduction dans l'organisation cliente."
      source_section: "3.2.3 / 7"
    - code: CLOSING
      name: Clôture
      order: 4
      purpose: "Coordonner l'acceptation finale, documenter l'expérience, transférer les livrables et fermer administrativement le projet."
      source_section: "3.2.4 / 8"
  transversal:
    - code: MONITORING_CONTROL
      name: Suivi et Contrôle
      purpose: "Superviser les travaux, mesurer les progrès, contrôler les écarts, gérer les changements, risques et problèmes et prendre les mesures correctives."
      source_section: "3.2.5 / 9"

status_model:
  project: [DRAFT, LAUNCH, PLANNING, EXECUTION, CLOSING, CLOSED, ARCHIVED]
  artifact: [DRAFT, IN_REVIEW, APPROVED, BASELINED, SUPERSEDED, ARCHIVED]
  gate: [NOT_READY, READY_FOR_REVIEW, APPROVED, REJECTED]

roles:
  standard:
    - code: AGB
      name: Organe de Gouvernance Approprié
    - code: PSC
      name: Comité de Pilotage
    - code: PO
      name: Porteur du Projet
    - code: SP
      name: Maître d'Œuvre
    - code: BM
      name: Responsable MOA
    - code: PM
      name: Chef de Projet
    - code: BIG
      name: Groupe de Mise en Œuvre Organisationnelle
    - code: PCT
      name: Équipe Centrale du Projet
    - code: PST
      name: Équipe d'Assistance Projet
    - code: PMA
      name: Assistant du Chef de Projet
    - code: PQA
      name: Assurance Qualité
    - code: UR
      name: Représentants Utilisateurs
    - code: BA
      name: Analyste fonctionnel
    - code: CPM
      name: Chef de Projet externe
  support:
    - code: PSO
      name: Bureau de Soutien aux Projets
      optional: true
      note: "Le guide précise que toutes les organisations ne disposent pas d'un PSO."
  operational_custom:
    allowed: true
    note: "Le guide prévoit des rôles opérationnels et des rôles spécifiques au domaine en complément des rôles PM² standard."

responsibility_types:
  R:
    name: Responsable
    cardinality: many
  Cm:
    name: Comptable
    cardinality: max_one
  S:
    name: Support
    cardinality: many
  C:
    name: Consulté
    cardinality: many
  I:
    name: Informé
    cardinality: many
  NA:
    name: Non applicable
    cardinality: many

