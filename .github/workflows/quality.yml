name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Qt runtime libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install uv
        run: python -m pip install uv
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest --cov=pm2 --cov-report=term-missing --cov-report=xml
      - name: Lint
        run: uv run ruff check src tests scripts migrations
      - name: Type check
        run: uv run mypy src/pm2/domain src/pm2/application src/pm2/infrastructure src/pm2/methodology
      - name: Build wheel
        run: uv build --wheel
