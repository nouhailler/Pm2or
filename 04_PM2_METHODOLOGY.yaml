registers:
  - code: RISK_REGISTER
    name: Registre des Risques
    phase: LAUNCH
    lifecycle: "LAUNCH..CLOSING"
  - code: ISSUE_REGISTER
    name: Registre des Problèmes
    phase: LAUNCH
    lifecycle: "LAUNCH..CLOSING"
  - code: DECISION_REGISTER
    name: Registre des Décisions
    phase: LAUNCH
    lifecycle: "LAUNCH..CLOSING"
  - code: CHANGE_REGISTER
    name: Registre des Modifications
    phase: PLANNING
    lifecycle: "PLANNING..CLOSING"

monitoring_control:
  continuous: true
  intensity_note: "Le guide indique que le Suivi et Contrôle est mené tout au long du cycle de vie et atteint son intensité maximale pendant l'Exécution."
  activities:
    - MC-001
    - MC-002
    - MC-003
    - MC-004
    - MC-005
    - MC-006
    - MC-007
    - MC-008
    - MC-009
    - MC-010
    - MC-011
    - MC-012
    - MC-013

gates:
  - code: RFP
    name: RfP
    label: Prêt pour la Planification
    from_phase: LAUNCH
    to_phase: PLANNING
    review_point: "Fin de la Phase de Lancement"
    approver_roles: [PSC, AGB]
    responsible_role: PM
    checklist:
      - id: RFP-01
        description: "Demande d'Initiation de Projet établie"
        type: artifact
        artifact: PROJECT_INITIATION_REQUEST
        required: true
      - id: RFP-02
        description: "Étude d'Opportunité établie"
        type: artifact
        artifact: BUSINESS_CASE
        required: true
      - id: RFP-03
        description: "Charte du Projet établie et soumise à approbation"
        type: artifact
        artifact: PROJECT_CHARTER
        required: true
      - id: RFP-04
        description: "Décision de poursuivre vers la Planification"
        type: decision
        required: true
    source_section: "5.5"
  - code: RFE
    name: RfE
    label: Prêt pour l'Exécution
    from_phase: PLANNING
    to_phase: EXECUTION
    review_point: "Fin de la Phase de Planification"
    approver_roles: [PSC]
    escalation_roles: [AGB]
    responsible_role: PM
    checklist:
      - id: RFE-01
        description: "Objectifs de la Phase de Planification atteints"
        type: phase_objective
        required: true
      - id: RFE-02
        description: "Manuel du Projet disponible"
        type: artifact
        artifact: PROJECT_HANDBOOK
        required: true
      - id: RFE-03
        description: "Matrice des Parties Prenantes disponible"
        type: artifact
        artifact: STAKEHOLDER_MATRIX
        required: true
      - id: RFE-04
        description: "Plan de Travail approuvé et servant de référence"
        type: artifact
        artifact: WORK_PLAN
        required: true
      - id: RFE-05
        description: "Plan d'Acceptation des Livrables disponible"
        type: artifact
        artifact: DELIVERABLE_ACCEPTANCE_PLAN
        required: true
      - id: RFE-06
        description: "Plans de gestion nécessaires au projet établis"
        type: artifact_group
        required: true
      - id: RFE-07
        description: "Livrables du projet identifiés"
        type: data
        required: true
      - id: RFE-08
        description: "Écarts importants par rapport à l'Étude d'Opportunité ou à la Charte traités et, si nécessaire, soumis à l'AGB"
        type: variance_review
        required: true
    source_section: "6.9"
  - code: RFC
    name: RfC
    label: Prêt pour la Clôture
    from_phase: EXECUTION
    to_phase: CLOSING
    review_point: "Fin de la Phase d'Exécution"
    approver_roles: [PSC]
    responsible_role: PM
    acceptance_role: PO
    checklist:
      - id: RFC-01
        description: "Objectifs de la Phase d'Exécution atteints"
        type: phase_objective
        required: true
      - id: RFC-02
        description: "Activités prévues réalisées ou correctement traitées"
        type: work_plan
        required: true
      - id: RFC-03
        description: "Exigences satisfaites"
        type: requirements
        required: true
      - id: RFC-04
        description: "Livrables entièrement réalisés"
        type: deliverables
        required: true
      - id: RFC-05
        description: "Livrables acceptés au moins provisoirement par le Porteur du Projet"
        type: acceptance
        required: true
      - id: RFC-06
        description: "Transition finalisée ou correctement engagée"
        type: transition
        required: true
      - id: RFC-07
        description: "Résultats mis à disposition des utilisateurs finaux"
        type: delivery
        required: true
    source_section: "7.6"

validation_rules:
  severity: [ERROR, WARNING, INFO]
  rules:
    - id: PM2-PROJECT-001
      severity: ERROR
      applies_to: project
      condition: "name != null && reference != null && methodology_id == 'pm2'"
      message: "Le projet doit avoir un nom, une référence et la méthodologie PM²."
    - id: PM2-GOV-001
      severity: ERROR
      applies_to: governance
      condition: "exactly_one_active_role('PM')"
      message: "Un seul Chef de Projet (PM) actif doit être désigné."
    - id: PM2-GOV-002
      severity: ERROR
      applies_to: governance
      condition: "exactly_one_active_role('PO')"
      message: "Un seul Porteur de Projet (PO) actif doit être désigné."
    - id: PM2-RAM-001
      severity: ERROR
      applies_to: responsibility_assignment
      condition: "max_one('R', subject) && max_one('Cm', subject)"
      message: "Un sujet ne peut avoir qu'un Responsable R et qu'un Comptable Cm."
    - id: PM2-WP-001
      severity: ERROR
      applies_to: work_plan
      condition: "baseline_exists_before_execution"
      message: "Le Plan de Travail doit être approuvé/baseliné avant l'Exécution."
    - id: PM2-WP-002
      severity: WARNING
      applies_to: work_plan
      condition: "all_project_activities_are_planned"
      message: "Toutes les activités identifiées doivent être intégrées au Plan de Travail."
    - id: PM2-REQ-001
      severity: WARNING
      applies_to: requirement
      condition: "verification_method != null"
      message: "Le besoin devrait disposer d'une méthode de vérification."
    - id: PM2-DEL-001
      severity: ERROR
      applies_to: deliverable
      condition: "acceptance_coverage_exists"
      message: "Chaque livrable doit être couvert par le processus d'acceptation."
    - id: PM2-DEL-002
      severity: ERROR
      applies_to: acceptance
      condition: "criteria_count > 0"
      message: "Un livrable ne peut être accepté sans critères d'acceptation."
    - id: PM2-ACTION-001
      severity: WARNING
      applies_to: action
      condition: "owner != null"
      message: "Toute action devrait avoir un responsable."
    - id: PM2-RISK-001
      severity: WARNING
      applies_to: risk
      condition: "tolerance_evaluated == true"
      message: "La tolérance au risque doit être évaluée."
    - id: PM2-CHANGE-001
      severity: ERROR
      applies_to: change
      condition: "status != 'IMPLEMENTING' || approved == true"
      message: "Une modification ne peut passer à l'implémentation qu'après approbation."
    - id: PM2-GATE-001
      severity: ERROR
      applies_to: gate
      condition: "all_required_checklist_items_pass == true"
      message: "Un gate ne peut être approuvé si un élément obligatoire de sa checklist échoue."
    - id: PM2-GATE-002
      severity: ERROR
      applies_to: gate
      condition: "phase == gate.from_phase"
      message: "Un gate ne peut être évalué que depuis sa phase source."
    - id: PM2-TRACE-001
      severity: WARNING
      applies_to: traceability
      condition: "no_orphan_critical_entities"
      message: "Les éléments critiques ne devraient pas rester orphelins dans la chaîne de traçabilité."
    - id: PM2-BASELINE-001
      severity: ERROR
      applies_to: baseline
      condition: "only_one_current_baseline_per_artifact_type"
      message: "Un seul état de référence courant doit être actif par artefact baseliné."
    - id: PM2-CLOSE-001
      severity: ERROR
      applies_to: closing
      condition: "all_required_deliverables_accepted_or_dispositioned"
      message: "La clôture exige que les livrables soient acceptés ou qu'une disposition formelle soit enregistrée."
    - id: PM2-CLOSE-002
      severity: ERROR
      applies_to: closing
      condition: "final_report_exists && lessons_learned_exists"
      message: "Le rapport de fin de projet et les leçons apprises doivent être disponibles avant la fermeture administrative."

traceability:
  mandatory_chains:
    - chain: [PROJECT_CHARTER, WORK_PLAN, TASK]
      description: "La Charte définit le cadre et le Plan de Travail détaille le travail à réaliser."
    - chain: [REQUIREMENT, TASK]
      description: "Les besoins doivent être reliés au travail permettant leur réalisation et leur vérification."
    - chain: [REQUIREMENT, DELIVERABLE, ACCEPTANCE_CRITERION, ACCEPTANCE]
      description: "Traçabilité de l'exigence jusqu'à l'acceptation."
    - chain: [RISK, RISK_ACTION, TASK]
      description: "Les actions de réponse aux risques doivent pouvoir être planifiées."
    - chain: [ISSUE, ISSUE_ACTION, TASK]
      description: "Les actions de résolution des problèmes doivent pouvoir être planifiées."
    - chain: [CHANGE_REQUEST, CHANGE_IMPACT, TASK]
      description: "Les impacts d'un changement doivent pouvoir être reliés au Plan de Travail."
    - chain: [DELIVERABLE, TRANSITION_ACTIVITY]
      description: "Les livrables concernés doivent pouvoir être reliés aux activités de transition."

optional_features:
  outsourcing:
    enabled_when: "project.outsourcing_required == true"
  transition:
    enabled_when: "project.transition_required == true"
  organisational_implementation:
    enabled_when: "project.organisation_implementation_required == true"

source_notes:
  exact_from_guide:
    - "PM² est adaptable aux besoins spécifiques du projet."
    - "Les quatre phases sont Lancement, Planification, Exécution et Clôture, avec Suivi et Contrôle pendant toute la durée du projet."
    - "RfP intervient à la fin du Lancement, RfE à la fin de la Planification et RfC à la fin de l'Exécution."
    - "Le Plan de Travail approuvé sert de référence au suivi et au contrôle et doit être tenu à jour."
    - "Chaque livrable doit être officiellement accepté selon le processus d'acceptation."
  implementation_conventions:
    - "Les identifiants techniques de données comme PERFORMANCE_STATUS, COST_STATUS ou STAKEHOLDER_STATUS sont des objets applicatifs et non des artefacts PM² nommés dans le guide."
    - "Les règles de cardinalité, les expressions de validation et les statuts logiciels sont des contraintes de l'application V0.1 destinées à rendre la méthodologie exécutable."
